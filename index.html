<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>С Днём Рождения!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050508;
      color: #fff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    
    /* Контейнер прижимает плашку к ПРАВОМУ НИЖНЕМУ краю */
    .ui-overlay {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    
    /* Сама карточка - маленькая и компактная */
    .card-box {
      background: rgba(15, 15, 25, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 16px;
      text-align: right;
      max-width: 260px; /* Очень компактная */
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
      transition: opacity 0.5s ease;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    /* Блок с текстом, который будет исчезать */
    #text-content {
      transition: opacity 1s ease;
      opacity: 1;
    }
    
    h1.hb-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ff769c, #ff4b72, #ffd166);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    p {
      font-size: 0.85rem;
      line-height: 1.4;
      color: #e2e8f0;
      margin-bottom: 12px;
    }

    .btn {
      background: linear-gradient(135deg, #ff4b72, #ff769c);
      color: #fff;
      border: none;
      padding: 8px 18px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 75, 114, 0.3);
      transition: transform 0.2s ease;
      margin-top: 4px;
    }
    .btn:active {
      transform: scale(0.95);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-overlay">
    <div class="card-box" id="card">
      <div id="text-content">
        <h1 class="hb-title" id="title">Сюрприз 🎁</h1>
        <p id="description">Нажми на кнопку ниже...</p>
      </div>
      <button class="btn" id="next-btn" onclick="nextStep()">Открыть</button>
    </div>
  </div>

  <script>
    const PHOTO_URL = 'https://i.postimg.cc/B6My1kj1/IMG-20250820-113600.jpg'; 
    const PARTICLE_COUNT = 15000;

    let currentStep = 0;
    let textTimer;

    // Функция для показа текста и его автоматического скрытия
    function showText(titleText, descText, hideAfterMs) {
      const textContent = document.getElementById('text-content');
      const title = document.getElementById('title');
      const desc = document.getElementById('description');

      clearTimeout(textTimer); // Сбрасываем старый таймер
      
      title.innerText = titleText;
      desc.innerHTML = descText;
      
      textContent.style.display = 'block';
      setTimeout(() => {
        textContent.style.opacity = '1';
      }, 50);

      // Если указано время, прячем текст
      if (hideAfterMs > 0) {
        textTimer = setTimeout(() => {
          textContent.style.opacity = '0'; // Плавное исчезновение
          setTimeout(() => {
            textContent.style.display = 'none'; // Убираем элемент, оставляем только кнопку
          }, 1000);
        }, hideAfterMs);
      }
    }

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 100;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    function createHeartTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(32, 52);
      ctx.bezierCurveTo(12, 34, 4, 22, 16, 10);
      ctx.bezierCurveTo(24, 2, 32, 12, 32, 12);
      ctx.bezierCurveTo(32, 12, 40, 2, 48, 10);
      ctx.bezierCurveTo(60, 22, 52, 34, 32, 52);
      ctx.fill();
      return new THREE.CanvasTexture(canvas);
    }

    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const targetPhoto = new Float32Array(PARTICLE_COUNT * 3);
    const targetGalaxy = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);

    for (let i = 0; i < PARTICLE_COUNT * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 300;
      positions[i + 1] = (Math.random() - 0.5) * 300;
      positions[i + 2] = (Math.random() - 0.5) * 300;
      colors[i] = 1.0;
      colors[i + 1] = 0.5;
      colors[i + 2] = 0.7;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: 1.8,
      map: createHeartTexture(),
      transparent: true,
      alphaTest: 0.1,
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);

    function generateGalaxyTargets() {
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;
        const radius = Math.random() * 80 + 5;
        const arms = 3;
        const spin = radius * 0.1;
        const branchAngle = ((i % arms) / arms) * Math.PI * 2;
        const randomX = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1)) * 5;
        const randomY = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1)) * 5;
        const randomZ = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1)) * 5;
        targetGalaxy[i3] = Math.cos(branchAngle + spin) * radius + randomX;
        targetGalaxy[i3 + 1] = randomY;
        targetGalaxy[i3 + 2] = Math.sin(branchAngle + spin) * radius + randomZ;
      }
    }
    generateGalaxyTargets();

    const img = new Image();
    img.crossOrigin = "Anonymous";
    img.src = PHOTO_URL;
    img.onload = () => {
      const imgCanvas = document.createElement('canvas');
      const ctx = imgCanvas.getContext('2d');
      const size = 150;
      imgCanvas.width = size;
      imgCanvas.height = size;
      ctx.drawImage(img, 0, 0, size, size);
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;
        const x = Math.floor(Math.random() * size);
        const y = Math.floor(Math.random() * size);
        targetPhoto[i3] = (x - size / 2) * 0.5;
        targetPhoto[i3 + 1] = -(y - size / 2) * 0.5;
        targetPhoto[i3 + 2] = (Math.random() - 0.5) * 2;
      }
    };

    function nextStep() {
      const card = document.getElementById('card');
      const btn = document.getElementById('next-btn');

      currentStep++;

      if (currentStep === 1) {
        // ШАГ 1: ПОЗДРАВЛЕНИЕ (Исчезнет через 12 секунд)
        showText("С Днём Рождения! 🎂🎉", "Здесь будет твой длинный текст поздравления. Можешь написать всё что угодно, текст сам исчезнет через 12 секунд!", 12000);
        btn.innerText = "Далее ❤️";
      } else if (currentStep === 2) {
        // ШАГ 2: ФОТО (Исчезнет через 8 секунд)
        showText("Это ты! ✨", "Каждое маленькое сердечко здесь — это моя любовь к тебе.", 8000);
        btn.innerText = "Далее 🌌";
      } else if (currentStep === 3) {
        // ШАГ 3: ГАЛАКТИКА
        card.style.opacity = '0';
        card.style.pointerEvents = 'none';
      }
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const posAttr = geometry.attributes.position;
      const currentPos = posAttr.array;
      let speed = 2.0 * delta;

      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        if (currentStep === 2) {
          currentPos[i] += (targetPhoto[i] - currentPos[i]) * speed; // Собираем фото
        } else if (currentStep === 3) {
          currentPos[i] += (targetGalaxy[i] - currentPos[i]) * speed; // Собираем галактику
        }
      }

      posAttr.needsUpdate = true;

      if (currentStep === 3) {
        particleSystem.rotation.y += 0.25 * delta;
        particleSystem.rotation.x += 0.08 * delta;
      } else {
        particleSystem.rotation.y = Math.sin(clock.getElapsedTime() * 0.5) * 0.1;
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
